[package]
name = "lingua_native"
version = "0.2.0"
edition = "2021"

[lib]
name = "lingua_native"
crate-type = ["staticlib", "cdylib"]

[dependencies]
lingua = { version = "1.8.0", default-features = false }
libc = "0.2.183"
lazy_static = "1.5.0"

[build-dependencies]
cbindgen = "0.29.2"

# Language models are feature-gated. The default build compiles all 75
# languages (~330MB static lib per target). Build scripts pass
# --no-default-features --features <names> when LINGUA_LANGUAGES is set,
# so consumers can compile only the languages they need.
[features]
default = ["all-languages"]
all-languages = [
  "lingua/afrikaans",
  "lingua/albanian",
  "lingua/arabic",
  "lingua/armenian",
  "lingua/azerbaijani",
  "lingua/basque",
  "lingua/belarusian",
  "lingua/bengali",
  "lingua/bokmal",
  "lingua/bosnian",
  "lingua/bulgarian",
  "lingua/catalan",
  "lingua/chinese",
  "lingua/croatian",
  "lingua/czech",
  "lingua/danish",
  "lingua/dutch",
  "lingua/english",
  "lingua/esperanto",
  "lingua/estonian",
  "lingua/finnish",
  "lingua/french",
  "lingua/ganda",
  "lingua/georgian",
  "lingua/german",
  "lingua/greek",
  "lingua/gujarati",
  "lingua/hebrew",
  "lingua/hindi",
  "lingua/hungarian",
  "lingua/icelandic",
  "lingua/indonesian",
