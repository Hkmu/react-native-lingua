buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['Lingua_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["Lingua_" + name]).toInteger()
}

// Rust build cache lives outside the package (and outside node_modules) so
// that reinstalling or patching the npm dependency never strands gigabytes
// of build output. Override with the standard CARGO_TARGET_DIR.
def linguaTargetDir = System.getenv('CARGO_TARGET_DIR') ?:
    (project.findProperty('LINGUA_CARGO_TARGET_DIR') ?:
        "${System.getProperty('user.home')}/.cache/react-native-lingua/rust-target")
def linguaJniLibDir = "${linguaTargetDir}/jni"

// Pick ABIs: the app's reactNativeArchitectures wins, then LINGUA_ANDROID_ABIS,
// then the default (arm64 devices + x86_64 emulators).
def linguaAbiList = {
  def rn = rootProject.findProperty('reactNativeArchitectures')
  def raw = rn != null ? rn.toString() :
      (project.findProperty('LINGUA_ANDROID_ABIS') ?: 'arm64-v8a,x86_64').toString()
  return raw.split(',').collect { it.trim() }.findAll { it }
}()

def linguaTripleMap = [
  'arm64-v8a'    : 'aarch64-linux-android',
  'armeabi-v7a'  : 'armv7-linux-androideabi',
  'x86'          : 'i686-linux-android',
  'x86_64'       : 'x86_64-linux-android'
]
def linguaAndroidTriples = linguaAbiList.collect { linguaTripleMap[it] }.findAll { it }
if (linguaAndroidTriples.size() != linguaAbiList.size()) {
  throw new GradleException(
      "Lingua: unsupported ABI in [${linguaAbiList.join(', ')}]. Supported: ${linguaTripleMap.keySet().join(', ')}")
}

// Optional comma-separated language subset (lingua feature names),
// e.g. LINGUA_LANGUAGES=english,chinese. Empty means all 75 languages.
def linguaLanguages = project.findProperty('LINGUA_LANGUAGES') ?:
    System.getenv('LINGUA_LANGUAGES') ?: ''

android {
  namespace "com.lingua"

  // Follow the app's NDK pin (root build.gradle ext) when present
  ndkVersion = rootProject.hasProperty('ndkVersion') ? rootProject.ext.get('ndkVersion') : "26.1.10909125"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

    externalNativeBuild {
      cmake {
        cppFlags "-O2 -frtti -fexceptions -Wall -Wno-unused-variable -fstack-protector-all"
        abiFilters(*linguaAbiList)
        arguments '-DANDROID_STL=c++_shared',
                  "-DLINGUA_LIB_DIR=${linguaJniLibDir}"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

// Build Rust library before native build
task buildRustHeader(type: Exec) {
  workingDir file("${projectDir}/../rust")
  commandLine 'make', 'header'
  environment 'CARGO_TARGET_DIR', linguaTargetDir
  if (linguaLanguages) {
    environment 'LINGUA_LANGUAGES', linguaLanguages
  }

  // Always run to ensure header is up to date
}

task buildRust(type: Exec) {
  workingDir file("${projectDir}/../rust")
  commandLine 'make', 'android'
  environment 'CARGO_TARGET_DIR', linguaTargetDir
  environment 'JNI_LIB_DIR', linguaJniLibDir
  environment 'ANDROID_ABIS', linguaAndroidTriples.join(' ')
  if (linguaLanguages) {
    environment 'LINGUA_LANGUAGES', linguaLanguages
  }

  dependsOn buildRustHeader
}

tasks.matching { it.name.startsWith('externalNativeBuild') || it.name.startsWith('buildCMake') || it.name.startsWith('configureCMake') }.configureEach {
  dependsOn buildRust
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
